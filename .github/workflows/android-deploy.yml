
name: Android CI/CD - Google Play

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Dar permisos de ejecución a Gradle
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 3. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Decodificar el certificado JKS
      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/upload-key.jks

          if [ ! -s app/upload-key.jks ]; then
            echo "ERROR: No se pudo generar el archivo JKS."
            exit 1
          fi

          echo "Certificado JKS generado correctamente."

      # 6. Validar el certificado
      - name: Validate Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore app/upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          echo "Certificado validado correctamente."

      # 7. Ejecutar pruebas
      - name: Run tests
        run: ./gradlew test

      # 8. Generar AAB firmado
      - name: Build Android App Bundle
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 9. Guardar el AAB generado
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # 10. Publicar en Google Play
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nexum.nexum
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
