
name: Android CI/CD - Google Play

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Preparar la firma Android
      - name: Configure Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > app/upload-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # 5. Ejecutar pruebas
      - name: Run tests
        run: ./gradlew test

      # 6. Generar AAB firmado
      - name: Build Android App Bundle
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 7. Subir el AAB como artefacto
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/outputs/bundle/release/*.aab

      # 8. Publicar en Google Play
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.empresa.miapp
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
